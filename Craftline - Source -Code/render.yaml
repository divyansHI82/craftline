services:
  - type: web
    name: craftline-knowledge-platform
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: craftline-postgres
          property: connectionString
      - key: TRUST_PROXY
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: craftline-postgres
    databaseName: craftline
    user: craftline_app
    plan: free
    region: oregon
    postgresMajorVersion: '18'
    ipAllowList: []
